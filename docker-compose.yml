services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend/certs:/app/certs:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
